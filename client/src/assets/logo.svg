<svg xmlns="http://www.w3.org/2000/svg" width="650" height="220" viewBox="0 0 650 220">

  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8">
        <animate attributeName="stop-color"
          values="#38BDF8;#8B5CF6;#22D3EE;#38BDF8"
          dur="5s"
          repeatCount="indefinite"/>
      </stop>

      <stop offset="100%" stop-color="#8B5CF6">
        <animate attributeName="stop-color"
          values="#8B5CF6;#22D3EE;#38BDF8;#8B5CF6"
          dur="5s"
          repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Developer Icon -->
  <g filter="url(#glow)">

    <text
      x="20"
      y="125"
      font-size="74"
      font-family="monospace"
      font-weight="700"
      fill="url(#grad)">
      &lt;
      <animateTransform
        attributeName="transform"
        type="translate"
        values="0 0;-5 0;0 0"
        dur="2s"
        repeatCount="indefinite"/>
    </text>

    <text
      x="70"
      y="125"
      font-size="74"
      font-family="monospace"
      font-weight="700"
      fill="url(#grad)">
      /
      <animate
        attributeName="opacity"
        values="1;.5;1"
        dur="1.5s"
        repeatCount="indefinite"/>
    </text>

    <text
      x="110"
      y="125"
      font-size="74"
      font-family="monospace"
      font-weight="700"
      fill="url(#grad)">
      &gt;
      <animateTransform
        attributeName="transform"
        type="translate"
        values="0 0;5 0;0 0"
        dur="2s"
        repeatCount="indefinite"/>
    </text>

  </g>

  <!-- Blinking Cursor -->
  <rect
      x="165"
      y="72"
      width="5"
      height="58"
      fill="url(#grad)">
      <animate
        attributeName="opacity"
        values="1;0;1"
        dur="1s"
        repeatCount="indefinite"/>
  </rect>

  <!-- Name -->
  <text
      x="210"
      y="92"
      font-family="Inter,Segoe UI,sans-serif"
      font-size="34"
      font-weight="800"
      fill="url(#grad)">
      Sohini Sharma
  </text>

  <!-- Role -->
  <text
      x="210"
      y="128"
      font-family="Inter,Segoe UI,sans-serif"
      font-size="20"
      fill="url(#grad)">
      Frontend Developer
  </text>

  <!-- Animated Underline -->
  <rect
      x="210"
      y="145"
      width="210"
      height="3"
      rx="2"
      fill="url(#grad)">
      <animate
        attributeName="width"
        values="0;210;0"
        dur="3s"
        repeatCount="indefinite"/>
  </rect>

</svg>