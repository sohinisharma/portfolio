<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">

  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8">
        <animate
          attributeName="stop-color"
          values="#38BDF8;#8B5CF6;#22D3EE;#38BDF8"
          dur="4s"
          repeatCount="indefinite"/>
      </stop>

      <stop offset="100%" stop-color="#8B5CF6">
        <animate
          attributeName="stop-color"
          values="#8B5CF6;#22D3EE;#38BDF8;#8B5CF6"
          dur="4s"
          repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5"/>
    </filter>
  </defs>


  <!-- Transparent Background -->


  <!-- Code Icon -->
  <g fill="url(#grad)" font-family="monospace" font-weight="bold" filter="url(#glow)">

    <!-- < -->
    <text x="4" y="40" font-size="28">
      &lt;
    </text>

    <!-- / -->
    <text x="23" y="40" font-size="28">
      /
    </text>

    <!-- > -->
    <text x="38" y="40" font-size="28">
      &gt;
    </text>

  </g>


  <!-- Blinking Cursor -->
  <rect x="55" y="18" width="2" height="25" fill="#38BDF8">
    <animate
      attributeName="opacity"
      values="1;0;1"
      dur="1s"
      repeatCount="indefinite"/>
  </rect>

</svg>